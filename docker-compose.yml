services:
  db:
    image: postgres:16-alpine
    container_name: chiro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiro
      POSTGRES_PASSWORD: chiro
      POSTGRES_DB: chiro
    ports:
      - "5432:5432"
    volumes:
      - chiro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiro"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: chiro-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://chiro:chiro@db:5432/chiro?sslmode=disable
      JWT_SECRET: dev-secret-local-1234
      REQUIRE_SECRET: "false"
      PORT: "8080"
      CORS_ORIGINS: http://localhost:5173,http://localhost:4173
      WEB_DIST: /app/web/build
    volumes:
      - ./backend:/src
      - /src/tmp
    depends_on:
      db:
        condition: service_healthy

volumes:
  chiro_pgdata:
