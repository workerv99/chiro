services:
  db:
    image: postgres:16-alpine
    container_name: chiro-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiro
      POSTGRES_PASSWORD: chiro
      POSTGRES_DB: chiro
    ports:
      - "5432:5432"
    volumes:
      - chiro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chiro"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  chiro_pgdata:
